# Render Blueprint: https://render.com/docs/blueprint-spec
# Set all environment variables in the Render dashboard (from backend/.env.example).

services:
  - type: web
    name: awaz-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
